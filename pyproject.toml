[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pvclean"
version = "1.0.0"
description = "Simulates row-level PV soiling and robot cleaning, and compares cleaning policies under electricity contracts."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy==2.5.4",
    "pandas==3.0.6",
    "scipy==1.18.1",
    "pvlib==0.16.1",
    "matplotlib==3.11.2",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
pvclean = "pvclean.cli:main"

[tool.setuptools.packages.find]
include = ["pvclean*"]

[tool.setuptools.package-data]
pvclean = ["defaults.yaml", "protocol.yaml", "sites/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
